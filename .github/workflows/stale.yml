name: Stale Issues

on:
  schedule:
    - cron: "0 0 * * *"

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          stale-issue-message: "This issue has been automatically marked as stale due to inactivity."
          days-before-stale: 60
          days-before-close: 14
